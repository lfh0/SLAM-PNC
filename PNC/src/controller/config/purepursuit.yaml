purepursuit_node:
  # 路径跟踪基础参数
  lookahead_distance: 0.8
  vehicle_avg_speed: 1.0

  # Tracking 状态航向和横向误差反馈
  kp_yaw_: 0.25
  kd_yaw_: 0.0
  kp_pos_: 0.1

  # Init 和 GoalYawAdjust 状态 yaw PID
  end_yaw_kp_: 0.1
  end_yaw_ki_: 0.0
  end_yaw_kd_: 0.01

  # CloseEnd 状态位置 PID
  end_pos_kp_: 0.5
  end_pos_ki_: 0.001
  end_pos_kd_: 0.01

  # 速度随曲率、航向误差和横向误差衰减
  curvature_velocity_gain: 3.0
  lateral_velocity_gain: 3.0
  rotate_in_place_threshold: 1.5
  derivative_filter_lambda: 0.8

  # 终点切换和完成阈值
  goal_slowdown_distance: 0.6
  goal_position_tolerance: 0.03
  goal_yaw_tolerance: 0.05
  # 距离进入该范围但始终达不到位置容差时，开始检测终点附近蠕动
  close_end_wriggle_distance: 0.06
  # 在上述小范围内连续蠕动超时，直接切换到航向调整
  close_end_timeout: 8.0
