search:
  # 规划器使用的地图必须和 RViz 点选目标所在的地图一致。
  map_topic: "/global_costmap_node/costmap/costmap"
  # map_topic: "/y_global_map"

  # A* / JPS / 混合A* 通用搜索参数
  lambda_heu: 1.0001
  # 99～100为硬碰撞区，1～98作为可通行的软膨胀代价区。
  occupied_threshold: 80
  obstacle_cost_weight: 5.0
  unknown_as_occupied: true
  allocate_num: 3000000
  max_search_time: 50000.0

  # A* 搜索窗口参数
  use_search_window: true
  search_window_margin: 20.0
  search_window_retry_margins: [20.0, 50.0, 100.0]

  # 混合A* 参数
  horizon: 50.0
  yaw_resolution: 0.3
  check_num: 5
  traj_forward_penalty: 1.0
  traj_back_penalty: 5.0
  traj_gear_switch_penalty: 0.0
  traj_steer_penalty: 0.2
  traj_steer_change_penalty: 0.0
  step_arc: 1.0
  checkl: 0.2
  max_vel: 0.5
  max_acc: 0.3
  max_cur: 0.3
  time_resolution: 0.1
  distance_resolution: 0.5
  velocity_resolution: 0.5

rrt:
  step_size: 1.0
  goal_bias: 0.7
  search_radius: 3.0
  max_search_time: 50000.0
  max_iterations: 500000

vehicle:
  cars_num: 1
  car_id: 0
  car_length: 2.054
  car_width: 0.44
  car_wheelbase: 0.8
  car_front_suspension: 0.93
  car_rear_suspension: 1.1
  car_max_steering_angle: 45.0
  car_d_cr: 0.0

planner:
  # 0: 全部搜索, 1: A*, 2: 混合A*, 3: JPS, 4: RRT
  search_type: 1
  # 起点来源里程计话题，RViz 只需要点一次 /move_base_simple/goal 作为终点。
  odom_topic: "/lio/robo/odom"
  # 路径第一个点 yaw 的前视距离，建议和 purepursuit_node/lookahead_distance 保持一致。
  path_yaw_lookahead_distance: 0.3

# 下面这些是 planning_server 节点私有参数，对应代码里的 nhPrivate.param(...)。
# 当前 launch 在 node 外加载本 yaml，因此需要放在 /planning_server 命名空间下。
planning_server:
  freq: 20
  Vel: 3.0
  Length: 2.054
  v_max: 5.0
  limit_v_and_kesi: true
  Q_set: [1.0, 1.0, 1.0]
  R_set: [3.0, 3.0]

  planner:
    traj_res_: 8
    dense_traj_res_: 20
    max_vel: 5.0

  vehicle:
    car_length: 2.054
    car_width: 0.44
    car_d_cr: 0.0
